name: Release

# Builds the signed APK and Play Store bundle. Run it from GitHub:
# Actions → Release → Run workflow. Needs the secrets listed in RELEASE.md.
# With "Publish the APK" ticked (the default), the APK is also attached to a
# public GitHub Release, so this link always serves the newest version:
# https://github.com/emmieybliss/allbiohub-app/releases/latest/download/allbiohub.apk
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK as a public download
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check the release key secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets first (RELEASE.md, step 2)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build settings
        run: tool/ci/write_env.sh .env.ci
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}

      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=${ANDROID_KEY_ALIAS:-allbiohub}
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          PROPS

      - run: flutter build apk --release --dart-define-from-file=.env.ci
      - run: flutter build appbundle --release --dart-define-from-file=.env.ci

      - name: Check the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          cert=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          if echo "$cert" | grep -q "CN=Android Debug"; then
            echo "::error::The APK was signed with the debug key. Check the release key secrets."
            exit 1
          fi
          {
            echo "## Signed release"
            echo
            echo "Version: $(grep '^version:' pubspec.yaml | cut -d' ' -f2)"
            echo
            echo "Release key fingerprints (for App Links and Firebase):"
            echo
            echo '```'
            echo "$cert" | grep -E 'SHA-1 digest|SHA-256 digest'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: allbiohub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: allbiohub-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish the APK
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          tag="v${version%%+*}"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/allbiohub.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/allbiohub.apk" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/allbiohub.apk" \
              --target "$GITHUB_SHA" --title "AllBioHub $tag" --latest \
              --notes "AllBioHub for Android, version $version. Download allbiohub.apk below and open it on your phone to install."
          fi
          {
            echo
            echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/allbiohub.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
