name: Release

# Builds the signed APK and Play Store bundle. Run it from GitHub:
# Actions → Release → Run workflow. Needs the secrets listed in RELEASE.md.
# With "Publish the APK" ticked (the default), the APKs are also attached to a
# public GitHub Release, so these links always serve the newest version:
# https://github.com/emmieybliss/allbiohub-app/releases/latest/download/allbiohub.apk
#   (every Android phone: 32- and 64-bit ARM)
# https://github.com/emmieybliss/allbiohub-app/releases/latest/download/allbiohub-arm64.apk
#   (smaller, for 64-bit phones: almost every phone sold since 2019)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK as a public download
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check the release key secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets first (RELEASE.md, step 2)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build settings
        run: tool/ci/write_env.sh .env.ci
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}

      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=${ANDROID_KEY_ALIAS:-allbiohub}
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          PROPS

      # Phones are ARM; leaving out x86_64 (emulators, a few Chromebooks)
      # makes the download roughly a third smaller. Each APK is a separate
      # build, not --split-per-abi, so they all keep pubspec's versionCode
      # and phones can move between them and to Google Play as updates.
      - name: Build the APKs
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          flutter build apk --release --target-platform android-arm,android-arm64 --dart-define-from-file=.env.ci
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/apk/allbiohub.apk"
          flutter build apk --release --target-platform android-arm64 --dart-define-from-file=.env.ci
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/apk/allbiohub-arm64.apk"
          cd "$RUNNER_TEMP/apk"
          sha256sum allbiohub.apk allbiohub-arm64.apk > SHA256SUMS.txt
      - run: flutter build appbundle --release --dart-define-from-file=.env.ci

      - name: Check the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in "$RUNNER_TEMP"/apk/*.apk; do
            cert=$("$apksigner" verify --print-certs "$apk")
            if echo "$cert" | grep -q "CN=Android Debug"; then
              echo "::error::$(basename "$apk") was signed with the debug key. Check the release key secrets."
              exit 1
            fi
          done
          {
            echo "## Signed release"
            echo
            echo "Version: $(grep '^version:' pubspec.yaml | cut -d' ' -f2)"
            echo
            echo "Release key fingerprints (for App Links and Firebase):"
            echo
            echo '```'
            echo "$cert" | grep -E 'SHA-1 digest|SHA-256 digest'
            echo '```'
            echo
            echo "APK sizes and SHA-256 checksums:"
            echo
            echo '```'
            ls -lh "$RUNNER_TEMP"/apk/*.apk | awk '{print $5, $NF}' | sed "s|$RUNNER_TEMP/apk/||"
            cat "$RUNNER_TEMP/apk/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: allbiohub-release-apk
          path: ${{ runner.temp }}/apk/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: allbiohub-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish the APK
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          tag="v${version%%+*}"
          files=("$RUNNER_TEMP/apk/allbiohub.apk" "$RUNNER_TEMP/apk/allbiohub-arm64.apk" "$RUNNER_TEMP/apk/SHA256SUMS.txt")
          notes="$RUNNER_TEMP/notes.md"
          sed "s/{{VERSION}}/$version/" tool/ci/release_notes.md > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" --title "AllBioHub $tag" --latest \
              --notes-file "$notes"
          fi
          {
            echo
            echo "Downloads:"
            echo "- https://github.com/$GITHUB_REPOSITORY/releases/latest/download/allbiohub.apk"
            echo "- https://github.com/$GITHUB_REPOSITORY/releases/latest/download/allbiohub-arm64.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
