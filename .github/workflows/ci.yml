name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      # Unsigned-for-distribution release APK (debug key) so every change can
      # be installed and tried. Real releases are signed locally: RELEASE.md.
      - run: flutter build apk --release --dart-define-from-file=.env.example
      - uses: actions/upload-artifact@v4
        with:
          name: allbiohub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  wordpress-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint
        run: find wordpress/allbiohub-app-api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php wordpress/allbiohub-app-api/tests/run.php
      - name: Package
        if: matrix.php == '8.3'
        run: cd wordpress && zip -r ../allbiohub-app-api.zip allbiohub-app-api -x 'allbiohub-app-api/tests/*'
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: allbiohub-app-api-plugin
          path: allbiohub-app-api.zip
          retention-days: 30
