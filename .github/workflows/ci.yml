name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      # Unsigned-for-distribution release APK (debug key) so every change can
      # be installed and tried. Real releases are signed locally: RELEASE.md.
      - run: flutter build apk --release --dart-define-from-file=env/example.json
      - uses: actions/upload-artifact@v4
        with:
          name: allbiohub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
