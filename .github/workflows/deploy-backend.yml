name: Deploy community backend

# Publishes the community features' security rules, database indexes and
# server functions to Firebase (COMMUNITY.md → Setup). Run it by hand from
# Actions → Deploy community backend → Run workflow. It never touches the
# WordPress site.

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
        working-directory: firebase/functions
      - run: npm run lint && npm test
        working-directory: firebase/functions
      - run: npm install -g firebase-tools@15

      - name: Sign in to Google Cloud
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret first (COMMUNITY.md → Setup)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Server settings. Kept out of Git; written only for this run.
      - name: Server settings
        env:
          ADMIN_EMAILS: ${{ secrets.COMMUNITY_ADMIN_EMAILS }}
        run: |
          project=$(jq -r .projects.default .firebaserc)
          {
            echo "ADMIN_EMAILS=$ADMIN_EMAILS"
            echo "WORDPRESS_BASE_URL=https://allbiohub.com"
            echo "STARTUP_API_PATH=/wp-json/allbiohub/v1"
          } > "functions/.env.$project"

      - name: Deploy
        run: firebase deploy --only firestore,storage,functions --non-interactive --force

      - name: Remove credentials from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" functions/.env.*
